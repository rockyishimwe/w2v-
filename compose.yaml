services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: waste2value
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waste2value}
      POSTGRES_DB: waste2value
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste2value -d waste2value"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
    image: waste2value:local
    ports:
      - "3000:3000"
    # Optional. Create it with `cp .env.docker.example .env` to supply
    # secrets (JWT_SECRET, GROQ_API_KEY, ...). Compose still starts when the
    # file is absent; auth then returns a clear error until a secret is set.
    env_file:
      - path: .env
        required: false
    environment:
      # Postgres lives in its own service; data survives container rebuilds.
      DATABASE_URL: postgresql://waste2value:${POSTGRES_PASSWORD:-waste2value}@db:5432/waste2value
      NODE_ENV: production
      # Absolute links and OAuth callbacks. Override for a public deployment.
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      # Uploads stay on local disk here (no BLOB_READ_WRITE_TOKEN set).
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  uploads-data:
