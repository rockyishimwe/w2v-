services:
  app:
    build:
      context: .
    image: waste2value:local
    ports:
      - "3000:3000"
    # Optional. Create it with `cp .env.docker.example .env` to supply
    # secrets (JWT_SECRET, GROQ_API_KEY, ...). Compose still starts when the
    # file is absent; auth then returns a clear error until a secret is set.
    env_file:
      - path: .env
        required: false
    environment:
      # SQLite data is kept outside the image and survives container rebuilds.
      DATABASE_URL: file:/data/waste2value.db
      NODE_ENV: production
      # Absolute links and OAuth callbacks. Override for a public deployment.
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - sqlite-data:/data
      - uploads-data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite-data:
  uploads-data:
